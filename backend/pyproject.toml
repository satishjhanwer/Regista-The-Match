[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regista"
version = "0.1.0"
description = "Real-time, explained and verified, personalized football match intelligence"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Satish Jhanwer" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
agents = [
    "agent-framework-core>=1.22",
    "agent-framework-foundry>=1.15",
    "agent-framework-openai>=1.17",
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
local = [
    "agent-framework-foundry-local>=1.0.0b261015",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["regista"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]
# every public module, class, function and method is documented; constructors are described by their class
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
